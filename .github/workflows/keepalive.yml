# Empêche la mise en veille du projet Supabase gratuit (pause après 7 jours sans activité).
# Appelle la fonction keepalive() tous les 3 jours ; le 1er du mois, enregistre une petite
# modification pour que GitHub ne désactive pas cette tâche (désactivation après 60 jours sans activité).
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js non renseigné"; exit 1; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo

      - name: Activité mensuelle du dépôt
        run: |
          if [ "$(date -u +%d)" != "01" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          date -u +%Y-%m-%d > .keepalive
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet || git commit -m "keepalive $(date -u +%Y-%m-%d)"
          git push
